version: "3.9"
services:

  backend:
    build: ./apps
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DB_NAME=training
      - DB_USER=peserta
      - DB_PASSWORD=password
      - DB_HOST=db
      - APP_PORT=3000
    volumes:
      - app-data:/app/public/images
    depends_on:
      - db

  db:
    image: mariadb
    restart: always
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=training
      - MYSQL_USER=peserta
      - MYSQL_PASSWORD=password
    volumes:
      - ./apps/database/:/docker-entrypoint-initdb.d
      - db-data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin
    restart: always
    ports:
      - "8000:80"
    environment:
      - PMA_HOST=db
    depends_on:
      - db

  web:
    build: ./nginx
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  app-data:
  db-data: